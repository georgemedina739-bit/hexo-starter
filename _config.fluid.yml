# ----------------------------------------------------------------
# Fluid 主题专用配置
# ----------------------------------------------------------------

# 浏览器标签栏图标
favicon: /img/fluid.png
apple_touch_icon: /img/fluid.png

# 导航栏设置
navbar:
  blog_title: "My Blog"
  menu:
    - { key: "home", link: "/", icon: "iconfont icon-home-fill" }
    - { key: "archive", link: "/archives/", icon: "iconfont icon-archive-fill" }
    - { key: "category", link: "/categories/", icon: "iconfont icon-category-fill" }
    - { key: "tag", link: "/tags/", icon: "iconfont icon-tags-fill" }
    - { key: "about", link: "/about/", icon: "iconfont icon-user-fill" }

# 首页设置 (合并后的版本)
index:
  banner_img: /img/1000003553.jpg
  text: "ATIT - 探索与记录"
  slogan:
    enable: true
    text: "hola"
  post_url_target: _blank
  post_meta:
    date: true
    category: true
    tag: true

# 文章页设置 (合并后的版本)
post:
  banner_img: /img/default.png
  share:
    enable: false
  copyright:
    enable: true
    content: '本博客所有文章除特别声明外，均采用 CC BY-SA 4.0 许可协议。转载请注明出处！'
  meta:
    author:
      enable: true
    date:
      enable: true
      format: "YYYY-MM-DD HH:mm"
  updated:
    enable: false
  prev_next:
    enable: true

# 颜色设置
color:
  navbar_bg_color: "#841021"
  navbar_bg_color_next: "#841021"
  link_color: "#2f4154"
  link_hover_color: "#1c2b39"

dark:
  enable: true
  # 暗黑模式下的全局背景色（默认是深蓝色/黑色）
  background_color: "#841021"
  # 暗黑模式下的文字颜色
  text_color: "#c4c6c9"
  # 暗黑模式下的链接颜色
  link_color: "#abb2bf"


# 脚注设置
footer:
  content: '<span>Made with Hexo & Fluid</span>'
